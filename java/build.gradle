plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
}

repositories {
    mavenCentral()
}

def grpcVersion = '1.68.1'
def protobufVersion = '3.25.5'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

dependencies {
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

// Use the shared proto file from ../proto (no copy inside the Java project)
sourceSets {
    main {
        proto { srcDir '../proto' }
    }
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protobufVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

application {
    mainClass = 'com.example.grpc.PingServer'
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs the Java gRPC client'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.grpc.PingClient'
    if (project.hasProperty('clientArgs')) {
        args project.property('clientArgs').split(' ')
    }
}
